# handle_data 公共配置：描述原始数据的结构，所有层级任务共用

# 数据列名映射：原始 CSV 的字段名，集中管理避免硬编码
columns:
  id: "id"
  time: "time"
  lon: "lon"
  lat: "lat"
  height: "height"
  speed: "speed"
  heading: "heading"
  aircraft_type: "aircraft_type"

# 时间字段解析格式
time:
  format: "%Y-%m-%d %H:%M:%S"

# 原始数据路径
paths:
  raw_dir: "data/raw"
